<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - IZIN GURU PON-PES</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>IZIN GURU PON-PES</h1>
    <p>Dashboard Laporan Izin Meninggalkan Ponpes DDI</p>
  </header>
  
  <nav class="nav-links">
    <a href="index.html">Form Izin</a>
    <a href="dashboard.html" class="active">Dashboard Laporan</a>
  </nav>

  <div class="container" style="max-width: 1200px;">
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-bottom: 1.5rem; gap: 1rem;">
      <h2 style="color: var(--primary-green); margin: 0;">Data Laporan Izin</h2>
      <a href="https://docs.google.com/spreadsheets/d/14AHVJK8EEo1eP_KHxQdxUdVKVziNJEFwSvyurYr0SmA/export?format=xlsx" 
         target="_blank" 
         style="text-decoration: none; background-color: var(--primary-green); color: var(--white); padding: 10px 20px; border-radius: 6px; font-weight: bold; display: inline-flex; align-items: center; gap: 8px; border: 2px solid var(--gold); transition: all 0.3s;"
         onmouseover="this.style.backgroundColor='var(--gold)'; this.style.color='var(--primary-green)'"
         onmouseout="this.style.backgroundColor='var(--primary-green)'; this.style.color='var(--white)'">
        📥 Download Spreadsheet (Excel)
      </a>
    </div>

    <!-- BAGIAN BARU: Filter Bulan -->
    <div class="form-group" style="max-width: 300px; margin-bottom: 1.5rem;">
      <label for="filterBulan" style="color: var(--primary-green);">Filter Berdasarkan Bulan:</label>
      <select id="filterBulan" onchange="applyFilter()" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px;">
        <option value="Semua">Semua Bulan</option>
        <option value="Januari">Januari</option>
        <option value="Februari">Februari</option>
        <option value="Maret">Maret</option>
        <option value="April">April</option>
        <option value="Mei">Mei</option>
        <option value="Juni">Juni</option>
        <option value="Juli">Juli</option>
        <option value="Agustus">Agustus</option>
        <option value="September">September</option>
        <option value="Oktober">Oktober</option>
        <option value="November">November</option>
        <option value="Desember">Desember</option>
      </select>
    </div>
    <!-- AKHIR BAGIAN BARU -->

    <div class="tabs" id="tabContainer">
      <button class="tab-btn active" onclick="showTab('MA')">MA</button>
      <button class="tab-btn" onclick="showTab('MTs')">MTs</button>
      <button class="tab-btn" onclick="showTab('SMP')">SMP</button>
      <button class="tab-btn" onclick="showTab('MIS')">MIS</button>
      <button class="tab-btn" onclick="showTab('TK')">TK</button>
      <button class="tab-btn" onclick="showTab('Pondok')">Pondok</button>
    </div>

    <div id="loading" class="loading">Memuat data dari database...</div>
    <div id="error" class="error" style="display: none;"></div>

    <div id="tableContainer" class="table-container" style="display: none;">
      <table id="dataTable">
        <thead>
          <tr>
            <th>No</th>
            <th>Nama Lengkap</th>
            <th>Jabatan</th>
            <th>Tingkatan</th>
            <th>Hari</th>
            <th>Tanggal</th>
            <th>Bulan</th> <!-- Kolom Baru di Tabel -->
            <th>Jam</th>
            <th>Alasan Keluar</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <script src="js/dashboard.js"></script>
</body>
</html>
